{% extends 'base.html' %}

{% block content %}
  <section class="page-shell article-shell">
    <div class="content-narrow">
      <a class="text-link back-link" href="{% url archive_url_name %}">Back to {{ archive_label }}</a>

      <article class="article-detail">
        <header class="article-header">
          <p class="post-meta">
            <span>{{ post.created_on|date:"M j, Y" }}</span>
            <span>{{ post.author.get_full_name|default:post.author.username }}</span>
          </p>
          <h1>{{ post.title }}</h1>
        </header>

        <div class="article-prose">
          {{ post.content|safe }}
        </div>
      </article>
    </div>
  </section>
{% endblock content %}
