services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://llkinvestresearch:llkinvestresearch@db:5432/llkinvestresearch
      POSTGRES_DB: llkinvestresearch
      POSTGRES_USER: llkinvestresearch
      POSTGRES_PASSWORD: llkinvestresearch
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llkinvestresearch
      POSTGRES_USER: llkinvestresearch
      POSTGRES_PASSWORD: llkinvestresearch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llkinvestresearch -d llkinvestresearch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
